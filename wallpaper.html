<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden;
    }

    img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.03)
    }
</style>

<body>
    <img src="" width="1920" height="1080" alt="">
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(document.location.search),
                img = document.querySelector("img");

            img.src = params.get('image');
            if (params.get("blur")) {
                img.style.filter = `blur(${params.get('blur')}px)`;
            }
        });
    </script>
</body>

</html>
